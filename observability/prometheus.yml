# Coleta das métricas da plataforma (ADR 0008, O3). Sobe com: docker compose --profile obs up -d
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
  - job_name: broker
    metrics_path: /metrics
    static_configs:
      - targets: ["broker:4000"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
