# Ambiente local completo. Subir: docker compose up -d --build
#
# Caminho de uma mensagem (ADR 0003):
#   canal -> api (Postgres + outbox) -> relay -> webhook -> broker -> Kafka -> mock-agent
#   mock-agent -> Kafka -> broker-replies -> api (como usuário bot)
#   sidekiq: jobs periódicos, como o vigia que escala o ticket quando o agente não responde
#
# Gates de teste:
#   docker compose run --rm test
#   docker compose run --rm broker-test
#   docker compose run --rm mock-agent-test
#   docker compose run --rm web-test
name: helpdesk

# Traces OpenTelemetry (ADR 0008, O2). Desligados por padrão; com a pilha de observabilidade:
#   OTEL_TRACES_EXPORTER=otlp docker compose --profile obs up -d
x-otel-env: &otel-env
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

x-backend: &backend
  build:
    context: ./backend
  image: helpdesk-backend
  volumes:
    - ./backend:/app
    - bundle:/usr/local/bundle
    # Cache de boot fora do disco do Windows: no bind mount o boot leva 5x mais.
    - bootsnap:/var/cache/bootsnap

x-backend-env: &backend-env
  DATABASE_HOST: postgres
  DATABASE_USER: ${POSTGRES_USER:-helpdesk}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev}
  BOOTSNAP_CACHE_DIR: /var/cache/bootsnap
  CHANNEL_WEBHOOK_SECRETS: ${CHANNEL_WEBHOOK_SECRETS:-dev-channel-secret}
  BROKER_WEBHOOK_SECRETS: ${BROKER_WEBHOOK_SECRETS:-dev-broker-secret}
  BROKER_WEBHOOK_URL: http://broker:4000/webhooks/helpdesk
  BOT_API_TOKEN: ${BOT_API_TOKEN:-dev-bot-token}
  REDIS_URL: redis://redis:6379/0
  <<: *otel-env

x-broker: &broker
  build:
    context: ./broker
  image: helpdesk-broker
  volumes:
    - ./broker:/app
    - broker-bundle:/usr/local/bundle

x-broker-env: &broker-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  BROKER_WEBHOOK_SECRETS: ${BROKER_WEBHOOK_SECRETS:-dev-broker-secret}
  PLATFORM_URL: http://api:3000
  BOT_API_TOKEN: ${BOT_API_TOKEN:-dev-bot-token}
  <<: *otel-env

x-mock-agent: &mock-agent
  build:
    context: ./mock_agent
  image: helpdesk-mock-agent
  volumes:
    - ./mock_agent:/app
    - mock-agent-bundle:/usr/local/bundle

x-web: &web
  build:
    context: ./frontend
  image: helpdesk-web
  volumes:
    - ./frontend:/app
    - web-node-modules:/app/node_modules

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Apache Kafka em modo KRaft, um nó (broker e controller no mesmo processo).
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados de forma explícita, nunca por acidente.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Plataforma de help desk (Rails API). Não fala com o Kafka.
  api:
    <<: *backend
    environment:
      <<: *backend-env
      # Chat do cliente simulado (ADR 0007, I7). Só em desenvolvimento e demonstração.
      CHANNEL_SIMULATOR_ENABLED: ${CHANNEL_SIMULATOR_ENABLED:-true}
    command: ["sh", "-c", "bundle exec rails db:prepare db:seed && bundle exec rails server -b 0.0.0.0"]
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Entrega o outbox ao broker como webhooks assinados. Se cair, o Docker reinicia.
  relay:
    <<: *backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: helpdesk-relay
    command: ["bundle", "exec", "rails", "outbox:relay"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy

  # Jobs em segundo plano e periódicos (sidekiq-cron, agendamento em backend/config/schedule.yml).
  sidekiq:
    <<: *backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: helpdesk-sidekiq
    command: ["bundle", "exec", "sidekiq"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Broker, sentido plataforma -> agente: recebe webhooks e publica no Kafka.
  # Na subida, cria os tópicos da borda do agente.
  broker:
    <<: *broker
    environment:
      <<: *broker-env
    command: ["sh", "-c", "bundle exec karafka topics migrate && bundle exec puma -b tcp://0.0.0.0:4000 config.ru"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # Broker, sentido agente -> plataforma: consome as respostas e chama a API como usuário bot.
  broker-replies:
    <<: *broker
    environment:
      <<: *broker-env
      OTEL_SERVICE_NAME: helpdesk-broker-replies
    command: ["bundle", "exec", "karafka", "server"]
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      api:
        condition: service_healthy

  # Agente de IA simulado. O agente real da CloudWalk é externo ao projeto.
  mock-agent:
    <<: *mock-agent
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MOCK_ESCALATION_RATE: ${MOCK_ESCALATION_RATE:-0.3}
      # Modo caos (spec 05), ex.: latency_ms=200..2000,duplicate=0.1,silence=0.05. Vazio: sem caos.
      MOCK_CHAOS: ${MOCK_CHAOS:-}
      <<: *otel-env
    command: ["bundle", "exec", "karafka", "server"]
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy

  # Interface (React + Vite). Repassa /api e /webhooks para a API: o navegador fala só com http://localhost:5173.
  web:
    <<: *web
    environment:
      API_PROXY_TARGET: http://api:3000
      # Bind mount do Windows não avisa mudanças de arquivo ao container (ver vite.config.ts).
      VITE_USE_POLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

  test:
    <<: *backend
    profiles: ["test"]
    environment:
      <<: *backend-env
      RAILS_ENV: test
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rspec"]
    depends_on:
      postgres:
        condition: service_healthy

  broker-test:
    <<: *broker
    profiles: ["test"]
    environment:
      <<: *broker-env
    command: ["bundle", "exec", "rspec"]
    depends_on:
      kafka:
        condition: service_healthy

  mock-agent-test:
    <<: *mock-agent
    profiles: ["test"]
    command: ["bundle", "exec", "rspec"]

  # Gate do frontend: tipos, lint e testes.
  web-test:
    <<: *web
    profiles: ["test"]
    command: ["npm", "run", "gate"]

  # Observabilidade (ADR 0002, D13; ADR 0008). Sobe com o perfil obs:
  #   OTEL_TRACES_EXPORTER=otlp docker compose --profile obs up -d
  # Jaeger 2 recebe OTLP direto (já é um coletor OpenTelemetry). Interface: http://127.0.0.1:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["obs"]
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  # Lag dos consumidores do Kafka para o Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    profiles: ["obs"]
    command: ["--kafka.server=kafka:9092"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  # Interface: http://127.0.0.1:9090
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # Painel da plataforma: http://127.0.0.1:3030 (leitura sem login; dados sintéticos de desenvolvimento).
  grafana:
    image: grafana/grafana:12.4.14
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helpdesk.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  kafka-data:
  bundle:
  bootsnap:
  broker-bundle:
  mock-agent-bundle:
  web-node-modules:
