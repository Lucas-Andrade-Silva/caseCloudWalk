# Ambiente local completo. Subir: docker compose up -d --build
# Testes (gate oficial): docker compose run --rm test
name: helpdesk

x-backend: &backend
  build:
    context: ./backend
  image: helpdesk-backend
  volumes:
    - ./backend:/app
    - bundle:/usr/local/bundle
    # Cache de boot fora do disco do Windows: no bind mount o boot leva 5x mais.
    - bootsnap:/var/cache/bootsnap
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-backend-env: &backend-env
  DATABASE_HOST: postgres
  DATABASE_USER: ${POSTGRES_USER:-helpdesk}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  BOOTSNAP_CACHE_DIR: /var/cache/bootsnap

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Apache Kafka em modo KRaft, um nó (broker e controller no mesmo processo).
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados de forma explícita, nunca por acidente.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    <<: *backend
    environment:
      <<: *backend-env
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"]
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Publica o outbox no Kafka. Processo de longa duração; se cair, o Docker reinicia.
  relay:
    <<: *backend
    environment:
      <<: *backend-env
    command: ["bundle", "exec", "rails", "outbox:relay"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy

  test:
    <<: *backend
    profiles: ["test"]
    environment:
      <<: *backend-env
      RAILS_ENV: test
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rspec"]

volumes:
  postgres-data:
  kafka-data:
  bundle:
  bootsnap:
