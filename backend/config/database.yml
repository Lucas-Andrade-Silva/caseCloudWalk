# Postgres roda no Docker Compose. Credenciais vêm do ambiente (ver .env.example na raiz).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  username: <%= ENV.fetch("DATABASE_USER", "helpdesk") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: helpdesk_development

test:
  <<: *default
  database: helpdesk_test

production:
  <<: *default
  database: helpdesk_production
